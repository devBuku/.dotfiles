font_family        Iosevka Nerd Font Mono
bold_font          auto
italic_font        auto
bold_italic_font   auto

font_size        10
enable_audio_bell no

shell_integration no-cursor
cursor_shape block

# Cursor animation
cursor_trail                   3
cursor_trail_decay             0.05 0.15
cursor_trail_start_threshold   0


# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME